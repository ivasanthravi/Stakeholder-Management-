# CI release gate. Mirrors app/scripts/release-gate.sh (run that locally). Not yet executed on GitHub: this repository
# has no remote configured — see docs/launch/deployment-runbook.md.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
defaults: { run: { working-directory: app } }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Dependency audit (runtime, high/critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx eslint . --max-warnings=50
      - name: Tests (PGlite)
        run: npx vitest run
      - name: Tests (real PostgreSQL via embedded-postgres)
        run: node scripts/test-postgres.mjs
      - name: AI evaluation + safety/grounding gate
        run: |
          AI_ENGINE=local npx tsx evals/run.ts > /dev/null
          npx tsx evals/gate.ts
      - name: Backup/restore drill
        run: npx tsx scripts/restore-drill.ts
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # Playwright uses the runner's installed Google Chrome (channel: 'chrome').
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: app/test-results, retention-days: 7 }
